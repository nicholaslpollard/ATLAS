name: B34 final closeout publisher

on:
  push:
    branches:
      - b34-final-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b34-final-closeout
          fetch-depth: 0

      - name: Publish B34 accepted closeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one replacement, got {count}")
              return new

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = sub_once(
              readme,
              r"- \*\*B34 intraday source readiness.*?(?=\n- Accepted numbered foundation:)",
              """- **B34 intraday source readiness and the opening/premarket pack are CLOSED / ACCEPTED.** The enhanced 2026-09-08 workstation audit returned `ACCEPTED` under contract `atlas-b34-intraday-source-readiness-v2-ohlcv-pack-frozen` with evidence SHA-256 `415c46c714b80f5cff4950320443088b8b89ed761c9f51d071fccf3e60baefd0`. It preserves the earlier semantic/source-readiness evidence SHA-256 `aad355e57c089a7aaea84a3f941091dec69d89ce87235972f13472a308550237`, accepted all five deterministic OHLCV samples, represented premarket/regular/after-hours bars, opened zero partitions overlapping the consumed `2026-05-12..2026-08-11` master interval, and made zero provider calls, broker reads, or broker writes. The frozen RESEARCH-only pack fingerprint is `6f7239fcda11ac6c890d2635980d431ec49e346707d9cc549f111bd50daaa4bf` for `b34_gap_continuation_v1`, `b34_opening_range_breakout_15m_v1`, `b34_premarket_relvol_consolidation_v1`, and `b34_highest_volume_day_style_v1`. B34 opened no outcomes and grants no promotion, PAPER, LIVE, broker-mutation, or broad/full minute-materialization authority.""",
              "README B34 status",
          )
          readme = sub_once(
              readme,
              r"Alpaca SIP V2 daily source/replay preparation is complete;\s+the next V2 data task is the finite B34 minute/intraday semantics audit\.",
              "Alpaca SIP V2 daily source/replay preparation and the finite B34 minute/intraday semantics audit are complete and accepted.",
              "README V2 data task",
          )
          readme = sub_once(
              readme,
              r"Earlier source limitations do not authorize invented\s+intraday history; V2 minute semantics remain subject to the finite B34 audit\.",
              "Earlier source limitations do not authorize invented intraday history; V2 minute semantics are now accepted by B34, and missing minute history remains preserved as absence rather than synthesized.",
              "README B34 provenance",
          )
          readme = sub_once(
              readme,
              r"Native minute evidence is hash-verified,\s+but extended-hours completeness and intraday strategy readiness remain a separate\s+B34 gate before gap, opening-range, or premarket performance may be opened\.",
              "Native minute evidence, extended-hours semantics, and initial intraday strategy readiness are accepted by B34. Gap, opening-range, and premarket performance remain unopened until a separately frozen pre-outcome evaluation contract authorizes development outcome access.",
              "README B34 performance gate",
          )
          readme_path.write_text(readme, encoding="utf-8")

          roadmap_path = Path("docs/roadmap.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap = sub_once(
              roadmap,
              r"\*\*Current as of 2026-09-07 \(UTC\)\.",
              "**Current as of 2026-09-08 (UTC).",
              "roadmap date",
          )
          roadmap = sub_once(
              roadmap,
              r"V2 minute capture still requires the finite\s+B34 semantics audit before intraday strategies; missing history may not be invented\.",
              "V2 minute semantics and the initial opening/premarket strategy pack are accepted by B34; missing history may not be invented, and performance remains separately gated.",
              "roadmap architecture B34",
          )
          roadmap = sub_once(
              roadmap,
              r"Native minute bundles are hash-verified during base acceptance,\s+but full extended-hours/intraday semantic acceptance and adjusted-minute derivation\s+remain B34 work\.",
              "Native minute bundles are hash-verified during base acceptance, and full extended-hours/intraday semantics are now accepted by B34. Adjusted-minute derivation remains deliberately absent: canonical minute bars are raw and cross-split price/volume lookbacks fail closed.",
              "roadmap B34 source note",
          )
          roadmap = sub_once(
              roadmap,
              r"\*\*B34 status \(2026-09-08\): source-readiness V1 ACCEPTED; finite strategy-pack closeout in acceptance\.\*\*.*?Final B34 closeout requires exact-head CI plus the enhanced workstation audit to return `ACCEPTED`\.",
              """**B34 status (2026-09-08): CLOSED / ACCEPTED.** The enhanced workstation audit returned `ACCEPTED` under `atlas-b34-intraday-source-readiness-v2-ohlcv-pack-frozen` with evidence SHA-256 `415c46c714b80f5cff4950320443088b8b89ed761c9f51d071fccf3e60baefd0`, while preserving semantic/source-readiness evidence SHA-256 `aad355e57c089a7aaea84a3f941091dec69d89ce87235972f13472a308550237`. All five deterministic OHLCV samples passed, including accepted zero-row source absence; sampled coverage represented 325 premarket, 933 regular, and 125 after-hours bars. The selector opened zero monthly partitions overlapping the consumed `2026-05-12..2026-08-11` master holdout and made zero provider calls, broker reads, or broker writes. Missing minutes remain absence rather than zero-filled or inferred halts; the 09:30 provider aggregate is not rewritten as a separate auction record; canonical minute bars remain raw/unadjusted; cross-split price/volume lookbacks fail closed; and a bar stamped `T` is usable only at `T+1m`, with premarket state available at 09:30 ET after stamp 09:29 and the 15-minute opening range available at 09:45 ET after stamp 09:44.

The frozen pre-outcome pack fingerprint is `6f7239fcda11ac6c890d2635980d431ec49e346707d9cc549f111bd50daaa4bf` and contains four RESEARCH-only references: `b34_gap_continuation_v1`, `b34_opening_range_breakout_15m_v1`, `b34_premarket_relvol_consolidation_v1`, and `b34_highest_volume_day_style_v1`. No governed performance was accessed; outcome access remains false. B34 grants no promotion, PAPER order authority, broker mutation, LIVE authority, or broad/full minute materialization. The next research step must freeze its evaluation design and a new blind/future validation boundary before opening development outcomes; the consumed master holdout may never be reused to qualify these strategies.""",
              "roadmap B34 closeout block",
          )
          roadmap = sub_once(
              roadmap,
              r"6\. \*\*ACTIVE — finite B34 closeout after accepted source readiness\.\*\*.*?If the enhanced audit is accepted, reconcile B34 closed and then choose the next Track-A/Track-B package explicitly\.",
              """6. **COMPLETE — B34 intraday readiness and frozen opening/premarket pack.** Final workstation evidence is `ACCEPTED`; repository acceptance retains the enhanced evidence hash, earlier semantic evidence hash, and frozen strategy-pack fingerprint without opening outcomes or trading authority.
7. **NEXT Track B — freeze the B35/A36 pre-outcome conditional-evidence contract.** Before any strategy performance is read, define the development-only replay population, realistic spread/slippage/fees and entry timing, outcome/exit conventions, point-in-time-safe stock-condition and market-regime taxonomy, portfolio/account simulation rules, multiple-comparison controls, walk-forward folds, robustness/stress tests, and a new future/blind validation boundary. The consumed `2026-05-12..2026-08-11` master holdout is permanently unavailable for qualifying these B34 strategies. This contract-design package itself must read zero strategy outcomes and grants no PAPER/LIVE authority.""",
              "roadmap immediate B34 action",
          )
          roadmap = sub_once(
              roadmap,
              r"\n7\. Keep focused tests, the full repository suite, retained scientific validators,",
              "\n8. Keep focused tests, the full repository suite, retained scientific validators,",
              "roadmap action renumber",
          )
          roadmap_path.write_text(roadmap, encoding="utf-8")

          evidence = {
              "contract": "atlas-b34-final-closeout-acceptance-v1",
              "status": "ACCEPTED",
              "accepted": True,
              "operator_generated_at_utc": "2026-09-08T02:03:44.876991+00:00",
              "enhanced_evidence_sha256": "415c46c714b80f5cff4950320443088b8b89ed761c9f51d071fccf3e60baefd0",
              "semantic_source_readiness_evidence_sha256": "aad355e57c089a7aaea84a3f941091dec69d89ce87235972f13472a308550237",
              "source_readiness_contract": "atlas-b34-intraday-source-readiness-v2-ohlcv-pack-frozen",
              "semantic_audit_contract": "atlas-b34-intraday-semantics-audit-v1",
              "b34_package_ready_for_repository_acceptance": True,
              "source_readiness_accepted": True,
              "ohlcv_validation": [
                  {"sample_class": "liquid_symbol_day", "symbol": "ZSL", "session_date": "2026-04-30", "row_count": 720, "accepted": True},
                  {"sample_class": "sparse_or_no_trade_symbol_day", "symbol": "ZNTEW", "session_date": "2026-04-30", "row_count": 0, "accepted": True, "note": "accepted source absence; no synthetic OHLCV row created"},
                  {"sample_class": "split_day", "symbol": "UK", "session_date": "2026-04-30", "row_count": 111, "accepted": True},
                  {"sample_class": "other_corporate_action_day", "symbol": "YQQQ", "session_date": "2026-04-30", "row_count": 63, "accepted": True},
                  {"sample_class": "dst_session_boundary_day", "symbol": "AA", "session_date": "2026-03-09", "row_count": 489, "accepted": True},
              ],
              "extended_hours_sample_segment_totals": {"premarket": 325, "regular": 933, "after_hours": 125},
              "information_clock": {
                  "bar_timestamp": "left edge/start of one-minute interval",
                  "bar_available": "timestamp + 1 minute",
                  "premarket_window_et": "04:00 inclusive through 09:30 exclusive",
                  "premarket_latest_eligible_stamp_et": "09:29",
                  "premarket_state_available_et": "09:30",
                  "opening_range_window_et": "09:30 inclusive through 09:45 exclusive",
                  "opening_range_latest_eligible_stamp_et": "09:44",
                  "opening_range_state_available_et": "09:45",
              },
              "split_adjustment_policy": {
                  "canonical_minute_adjustment": "raw",
                  "fabricate_adjusted_minute_bars": False,
                  "cross_split_price_or_volume_lookback": "ineligible_fail_closed",
              },
              "missing_bar_policy": "preserve source absence; no zero-fill, no synthetic halt classification",
              "protected_interval": {
                  "start": "2026-05-12",
                  "end": "2026-08-11",
                  "max_sample_date": "2026-04-30",
                  "overlapping_canonical_partitions_opened": 0,
              },
              "opening_premarket_pack": {
                  "contract": "atlas-b34-opening-premarket-pack-v1-pre-outcome",
                  "fingerprint": "6f7239fcda11ac6c890d2635980d431ec49e346707d9cc549f111bd50daaa4bf",
                  "authority": "RESEARCH",
                  "frozen": True,
                  "governed_performance_accessed": False,
                  "outcome_access_permitted": False,
                  "strategy_ids": [
                      "b34_gap_continuation_v1",
                      "b34_opening_range_breakout_15m_v1",
                      "b34_premarket_relvol_consolidation_v1",
                      "b34_highest_volume_day_style_v1",
                  ],
              },
              "provider_calls": 0,
              "broker_reads": 0,
              "broker_writes": 0,
              "paper_authority": False,
              "live_authority": False,
              "broad_minute_materialization_authority": False,
              "full_minute_materialization_authority": False,
              "closeout": "B34 closed as accepted source/semantics/readiness plus frozen pre-outcome RESEARCH strategy pack; strategy performance remains unopened.",
          }
          evidence_path = Path("docs/evidence/b34_final_closeout_acceptance.json")
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          Path(".github/workflows/_b34_final_closeout.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "B34 record final accepted closeout"
          git push origin HEAD:b34-final-closeout
