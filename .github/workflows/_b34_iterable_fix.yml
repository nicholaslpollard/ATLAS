name: B34 deterministic iterable hardening

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'b34-opening-premarket-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b34-opening-premarket-pack
          fetch-depth: 0
      - name: Materialize one-shot iterables and add regression coverage
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(' nJycsCi   nJycsCi '))"
      - name: Remove updater and commit
        shell: bash
        run: |
          git rm .github/workflows/_b34_iterable_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/strategies/intraday_opening_pack.py tests/unit/test_b34_opening_premarket_pack.py
          git commit -m "B34 make intraday evaluators iterable-stable"
          git push origin HEAD:b34-opening-premarket-pack
