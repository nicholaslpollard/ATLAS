name: B35 native-plan manifest confinement repair

on:
  push:
    branches:
      - b35-development-conditional-replay
    paths:
      - scripts/_b35_confine_plan_manifest.py
      - .github/workflows/_b35_confine_plan_manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-development-conditional-replay
          fetch-depth: 0
      - name: Apply manifest confinement repair
        run: python scripts/_b35_confine_plan_manifest.py
      - name: Remove temporary repair machinery
        shell: bash
        run: |
          rm scripts/_b35_confine_plan_manifest.py
          rm .github/workflows/_b35_confine_plan_manifest.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "B35 confine native plan manifest path"
          git push origin HEAD:b35-development-conditional-replay
