name: B35 entry-notional cost repair

on:
  push:
    branches:
      - b35-development-conditional-replay
    paths:
      - scripts/_b35_fix_entry_notional_costs.py
      - .github/workflows/_b35_fix_entry_notional_costs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-development-conditional-replay
          fetch-depth: 0
      - name: Apply entry-notional normalization repair
        run: python scripts/_b35_fix_entry_notional_costs.py
      - name: Remove temporary repair machinery
        shell: bash
        run: |
          rm scripts/_b35_fix_entry_notional_costs.py
          rm .github/workflows/_b35_fix_entry_notional_costs.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "B35 normalize net costs to entry notional"
          git push origin HEAD:b35-development-conditional-replay
