name: B35 governed replay scope hardening

on:
  push:
    branches:
      - b35-development-conditional-replay
    paths:
      - scripts/_b35_freeze_runner_scope.py
      - .github/workflows/_b35_freeze_runner_scope.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-development-conditional-replay
          fetch-depth: 0
      - name: Freeze governed replay scope and canonical paths
        run: python scripts/_b35_freeze_runner_scope.py
      - name: Remove temporary hardening machinery
        shell: bash
        run: |
          rm scripts/_b35_freeze_runner_scope.py
          rm .github/workflows/_b35_freeze_runner_scope.yml
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "B35 freeze governed replay scope and ledger paths"
          git push origin HEAD:b35-development-conditional-replay
