name: B35 preoutcome publisher

on:
  push:
    branches:
      - b35-a36-preoutcome-contract

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-a36-preoutcome-contract
          fetch-depth: 0
      - name: Publish B35 evidence and docs
        run: python scripts/_publish_b35_preoutcome_docs.py
      - name: Commit published package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "B35 publish frozen preoutcome contract evidence"
          git push origin HEAD:b35-a36-preoutcome-contract
