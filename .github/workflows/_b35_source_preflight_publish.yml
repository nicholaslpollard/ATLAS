name: B35 source-only preflight acceptance publisher

on:
  push:
    branches:
      - b35-source-preflight-acceptance
    paths:
      - scripts/_publish_b35_source_preflight.py
      - .github/workflows/_b35_source_preflight_publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: b35-source-preflight-acceptance
          fetch-depth: 0
      - name: Apply source-preflight acceptance updates
        run: python scripts/_publish_b35_source_preflight.py
      - name: Verify only permanent package remains
        shell: bash
        run: |
          test ! -e scripts/_publish_b35_source_preflight.py
          test ! -e .github/workflows/_b35_source_preflight_publish.yml
          git status --short
      - name: Commit and push permanent acceptance package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 1
          fi
          git commit -m "B35 record accepted source-only workstation preflight"
          git push origin HEAD:b35-source-preflight-acceptance
