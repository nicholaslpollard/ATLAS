name: B35 session validation finalizer

on:
  push:
    branches:
      - b35-session-label-performance-repair
    paths:
      - scripts/_finalize_b35_session_perf.py
      - .github/workflows/_finalize_b35_session_perf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-session-label-performance-repair
          fetch-depth: 0
      - run: python scripts/_finalize_b35_session_perf.py
      - name: Commit permanent hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "B35 fail closed on null session labels"
          git push origin HEAD:b35-session-label-performance-repair
