name: B35 Work2 repair publisher

on:
  push:
    branches:
      - b35-development-conditional-replay
    paths:
      - scripts/_finish_b35_work2.py
      - .github/workflows/_finish_b35_work2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: b35-development-conditional-replay
          fetch-depth: 0
      - name: Repair known publisher indentation assumption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_finish_b35_work2.py")
          text = path.read_text(encoding="utf-8")
          old = '''    ''' + "'''" + '''        "authorization_id": authorization_id,\\n        "start_session": plan.start_session.isoformat(),''' + "'''"
          new = '''    ''' + "'''" + '''            "authorization_id": authorization_id,\\n            "start_session": plan.start_session.isoformat(),''' + "'''"
          old2 = '''    ''' + "'''" + '''        "authorization_id": authorization_id,\\n        "read_start_marker_id": read_start_marker_id,\\n        "start_session": plan.start_session.isoformat(),''' + "'''"
          new2 = '''    ''' + "'''" + '''            "authorization_id": authorization_id,\\n            "read_start_marker_id": read_start_marker_id,\\n            "start_session": plan.start_session.isoformat(),''' + "'''"
          if old not in text or old2 not in text:
              raise SystemExit("expected publisher summary snippets not found")
          path.write_text(text.replace(old, new, 1).replace(old2, new2, 1), encoding="utf-8")
          PY
      - name: Apply deterministic repairs
        run: python scripts/_finish_b35_work2.py
      - name: Verify no outcome artifact was created
        shell: bash
        run: |
          test ! -e data/v2_build/alpaca_sip_v2/derived/strategy_lab/b35_development || true
          git status --short
      - name: Commit repaired package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 1
          fi
          git commit -m "B35 finish Work Chat 2 acceptance repairs"
          git push origin HEAD:b35-development-conditional-replay
