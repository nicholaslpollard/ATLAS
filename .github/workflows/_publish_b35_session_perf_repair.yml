name: B35 session-label performance repair publisher

on:
  push:
    branches:
      - b35-session-label-performance-repair
    paths:
      - scripts/_publish_b35_session_perf_repair.py
      - .github/workflows/_publish_b35_session_perf_repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-session-label-performance-repair
          fetch-depth: 0
      - name: Repair publisher roadmap anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_publish_b35_session_perf_repair.py")
          text = path.read_text(encoding="utf-8")
          old = '''roadmap_text = read("docs/roadmap.md")
          needle = "The next Track-B gate is the single canonical `--authorize-development-outcomes` replay"
          if needle not in roadmap_text:
              raise RuntimeError("roadmap B35 next-gate anchor not found")
          roadmap_text = roadmap_text.replace(
              needle,
              "The first single canonical `--authorize-development-outcomes` attempt created its immutable authorization/registration but stopped before completion on a B35 validator mismatch with the accepted V2 `closed` session label; after exact-head repair acceptance, the same canonical command must resume under the same authorization. The next Track-B gate after completion is strategy × condition analysis",
              1,
          )
          write("docs/roadmap.md", roadmap_text)
          '''
          new = '''replace_once(
              "docs/roadmap.md",
              ''' + repr('''7. **NEXT Track-B post-merge gate — B35 source-only workstation preflight.** After exact-head repository acceptance, run `python scripts/run_b35_development_replay.py --source-only`. This validates and records the exact frozen minute source plan plus split evidence and then stops before creating outcome authorization or opening any outcome. Review that source-only evidence in the control chat first. Only after that separate review may `--authorize-development-outcomes` explicitly open the one canonical frozen DEVELOPMENT replay over `2016-01-04..2026-04-30`; the consumed master and future blind remain structurally forbidden, and no PAPER/LIVE/provider/broker authority is granted.''') + ''',
              ''' + repr('''7. **CURRENT Track-B gate — resume the same canonical B35 DEVELOPMENT replay after the session-label/performance repair is accepted.** Source-only preflight is accepted. The first explicit `--authorize-development-outcomes` attempt created immutable authorization `562d7104d56151e6203a1bf85457f9d1a90bbf19e60cd4d9359a3f96bc0a7be5` and trial registration `b35.dev.20160104_20260430.eb3b7ff9f417.registration`, then stopped before completion because B35 incorrectly rejected the accepted V2 writer's `closed` minute-session label. The repair validates all four writer labels (`premarket`, `regular`, `after_hours`, `closed`), keeps closed/after-hours rows out of strategy materialization, and uses a bounded hardware-aware DuckDB scan profile. After exact-head acceptance/merge, rerun the same canonical `python scripts/run_b35_development_replay.py --authorize-development-outcomes`; it must reuse the immutable authorization/trial identity and the frozen `2016-01-04..2026-04-30` source. The consumed master/future blind remain forbidden and no PAPER/LIVE/provider/broker authority is granted. After successful completion, proceed to strategy × condition evidence and the preregistered selector.''') + ''',
          )
          '''
          if old not in text:
              raise SystemExit("publisher roadmap block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply deterministic repair
        run: python scripts/_publish_b35_session_perf_repair.py
      - name: Show permanent diff
        run: git status --short
      - name: Commit permanent package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 1
          fi
          git commit -m "B35 repair closed-session validation and scan efficiency"
          git push origin HEAD:b35-session-label-performance-repair
