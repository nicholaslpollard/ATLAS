name: Temporary account-state v2 focused matrix

'on':
  push:
    branches:
      - feature/option-aware-simulation-account-state

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install locked ATLAS dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile focused package
        run: python -m compileall -q packages/simulation/account_state_v2.py packages/simulation/account_state_v2_contract.py tests/test_simulation_account_state_v2.py
      - name: Run long-option reservation and account-state v2 tests
        run: python -m pytest -q tests/test_long_option_reservation.py tests/test_simulation_account_state_v2.py
