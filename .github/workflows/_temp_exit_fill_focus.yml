name: Temporary exit-fill focused matrix

on:
  push:
    branches:
      - feature/exit-fill-evidence

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked ATLAS dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile exit-fill package
        run: python -m compileall -q packages/simulation/exit_fill_evidence.py packages/simulation/exit_fill_evidence_contract.py tests/test_exit_fill_evidence.py
      - name: Run entry through exit-evidence tests
        run: python -m pytest -q tests/test_open_position_state.py tests/test_market_mark_evidence.py tests/test_marked_account_state.py tests/test_exit_fill_evidence.py
