name: Temporary finalize account-state v2

'on':
  push:
    branches:
      - feature/option-aware-simulation-account-state

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/option-aware-simulation-account-state
          fetch-depth: 0
      - name: Reconcile contract test and living documents
        run: python .github/_temp_finalize_account_v2.py
      - name: Remove temporary reconciliation helpers
        shell: bash
        run: |
          rm -f .github/_temp_finalize_account_v2.py
          rm -f .github/workflows/_temp_finalize_account_v2.yml
      - name: Commit reconciled account-state v2 tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md tests/test_simulation_account_state_v2.py .github/_temp_finalize_account_v2.py .github/workflows/_temp_finalize_account_v2.yml
          git commit -m "Reconcile stock-option account-state v2 living documents"
          git push origin HEAD:feature/option-aware-simulation-account-state
