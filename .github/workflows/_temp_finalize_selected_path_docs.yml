name: Temporary selected path living-document finalizer

on:
  push:
    branches:
      - research/selected-path-closeout-and-minute-v1
    paths:
      - scripts/_temp_finalize_selected_path_docs.py

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/selected-path-closeout-and-minute-v1
          fetch-depth: 0

      - name: Patch living documents
        run: python scripts/_temp_finalize_selected_path_docs.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit finalized living documents and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md
          git rm scripts/_temp_finalize_selected_path_docs.py .github/workflows/_temp_finalize_selected_path_docs.yml
          git commit -m "Close selected daily path evidence and freeze minute diagnostic"
          git push origin HEAD:research/selected-path-closeout-and-minute-v1
