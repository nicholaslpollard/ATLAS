name: Temporary selected minute assignment schema repair

on:
  push:
    branches:
      - fix/selected-minute-path-assignment-join
    paths:
      - scripts/_temp_fix_selected_minute_assignment_join.py
      - .github/workflows/_temp_fix_selected_minute_assignment_join.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/selected-minute-path-assignment-join
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ATLAS from locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Apply schema repair
        run: python scripts/_temp_fix_selected_minute_assignment_join.py

      - name: Validate formatting
        run: git diff --check

      - name: Compile repaired modules
        run: python -m compileall -q packages/backtesting/successor_selected_minute_path_analysis.py tests/test_successor_selected_minute_path_analysis.py

      - name: Run focused regression suite
        run: python -m pytest -q tests/test_successor_selected_minute_path_analysis.py

      - name: Commit repair and remove temporary helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md packages/backtesting/successor_selected_minute_path_analysis.py tests/test_successor_selected_minute_path_analysis.py
          git rm scripts/_temp_fix_selected_minute_assignment_join.py .github/workflows/_temp_fix_selected_minute_assignment_join.yml
          git commit -m "Repair selected minute assignment path-field binding"
          git push origin HEAD:fix/selected-minute-path-assignment-join
