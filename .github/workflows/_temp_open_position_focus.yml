name: Temporary open-position focused matrix

'on':
  push:
    branches:
      - feature/open-position-account-state
    paths:
      - .github/workflows/_temp_open_position_focus.yml

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install locked ATLAS dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile open-position package
        run: python -m compileall -q packages/simulation/open_position_state.py packages/simulation/open_position_state_contract.py tests/test_open_position_state.py
      - name: Run reservation through open-position tests
        run: python -m pytest -q tests/test_simulation_account_state_v2.py tests/test_simulated_entry_fill.py tests/test_simulation_funding_terms.py tests/test_open_position_state.py
