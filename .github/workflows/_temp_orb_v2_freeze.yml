name: Temporary ORB literature v2 freeze

on:
  push:
    branches:
      - research/orb-stocks-in-play-literature-v2-freeze
    paths:
      - scripts/_temp_record_orb_v2_freeze.py
      - .github/workflows/_temp_orb_v2_freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/orb-stocks-in-play-literature-v2-freeze
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Update living documents
        run: python scripts/_temp_record_orb_v2_freeze.py

      - name: Validate formatting
        run: git diff --check

      - name: Compile package
        run: python -m compileall -q packages/strategies/successor_orb_stocks_in_play_literature_v2.py packages/strategies/successor_orb_stocks_in_play_literature_v2_contract.py tests/test_successor_orb_stocks_in_play_literature_v2.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_successor_orb_stocks_in_play_literature_v2.py tests/test_successor_selected_minute_path_analysis.py

      - name: Commit freeze and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md packages/strategies/successor_orb_stocks_in_play_literature_v2.py packages/strategies/successor_orb_stocks_in_play_literature_v2_contract.py tests/test_successor_orb_stocks_in_play_literature_v2.py
          git rm scripts/_temp_record_orb_v2_freeze.py .github/workflows/_temp_orb_v2_freeze.yml
          git commit -m "Freeze literature-fidelity ORB v2 after minute-path closeout"
          git push origin HEAD:research/orb-stocks-in-play-literature-v2-freeze
