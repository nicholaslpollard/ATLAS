name: Reconcile long-option reservation docs

'on':
  push:
    branches:
      - feature/long-option-reservation-contract

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile living documents
        run: python .github/reconcile_long_option_111.py
      - name: Commit reconciled tree and remove temporary helpers
        run: |
          rm -f .github/reconcile_long_option_111.py
          rm -f .github/workflows/_temp_reconcile_long_option_111.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md .github/reconcile_long_option_111.py .github/workflows/_temp_reconcile_long_option_111.yml
          git commit -m "Reconcile long-option reservation living documents"
          git push origin HEAD:feature/long-option-reservation-contract
