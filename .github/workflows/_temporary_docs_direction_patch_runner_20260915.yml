name: Temporary living-document direction patch runner

on:
  push:
    branches:
      - docs/options-strategy-development-direction-20260915

permissions:
  contents: write

jobs:
  patch-living-docs:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/options-strategy-development-direction-20260915
          fetch-depth: 0
      - name: Apply staged idempotent patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/_temporary_docs_direction_patch_20260915.yml')
          text = source.read_text(encoding='utf-8')
          marker = '        run: |\n'
          end_marker = '      - name: Commit living-document update and remove temporary workflow\n'
          if marker not in text or end_marker not in text:
              raise SystemExit('staged patch block not found')
          block = text.split(marker, 1)[1].split(end_marker, 1)[0]
          code = textwrap.dedent(block)
          exec(compile(code, str(source), 'exec'), {})
          Path('.github/workflows/_temporary_docs_direction_patch_runner_20260915.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md \
            .github/workflows/_temporary_docs_direction_patch_20260915.yml \
            .github/workflows/_temporary_docs_direction_patch_runner_20260915.yml
          git diff --cached --check
          git commit -m "Record options-oriented strategy development direction"
          git push origin HEAD:docs/options-strategy-development-direction-20260915
