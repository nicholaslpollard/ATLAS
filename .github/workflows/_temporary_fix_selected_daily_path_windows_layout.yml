name: Temporary selected daily path Windows layout repair

on:
  push:
    branches:
      - fix/selected-daily-path-windows-layout

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/selected-daily-path-windows-layout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Apply repair and run focused tests
        run: |
          python scripts/_temporary_fix_selected_daily_path_windows_layout.py
          git diff --check
          python -m pytest -q tests/test_successor_selected_daily_path_analysis.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix selected daily path Windows artifact layout"
          git push origin HEAD:fix/selected-daily-path-windows-layout
