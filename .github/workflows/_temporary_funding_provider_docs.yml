name: Temporary Funding and Provider Docs Reconcile

'on':
  push:
    branches:
      - feature/funding-collateral-terms
    paths:
      - .github/workflows/_temporary_funding_provider_docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/funding-collateral-terms
          fetch-depth: 0
      - name: Reconcile README and roadmap
        run: python scripts/_temporary_reconcile_funding_provider_docs.py
      - name: Commit reconciled living documents and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_funding_provider_docs.yml scripts/_temporary_reconcile_funding_provider_docs.py
          git add README.md docs/roadmap.md
          git commit -m "Reconcile funding and live-data provider architecture"
          git push origin HEAD:feature/funding-collateral-terms
