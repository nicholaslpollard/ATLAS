name: Temporary Marked Account Docs Reconcile

on:
  push:
    branches:
      - feature/marked-account-state

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/marked-account-state
          fetch-depth: 0
      - name: Reconcile README and roadmap
        run: python scripts/_temporary_reconcile_marked_account_docs.py
      - name: Commit living documents and remove temporary helpers
        shell: bash
        run: |
          rm -f scripts/_temporary_reconcile_marked_account_docs.py
          rm -f .github/workflows/_temporary_marked_account_docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md scripts/_temporary_reconcile_marked_account_docs.py .github/workflows/_temporary_marked_account_docs.yml
          git commit -m "Reconcile marked-account valuation architecture"
          git push origin HEAD:feature/marked-account-state
