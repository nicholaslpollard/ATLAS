name: Temporary Open Position Docs Reconcile

'on':
  push:
    branches:
      - feature/open-position-account-state
    paths:
      - .github/workflows/_temporary_open_position_docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/open-position-account-state
          fetch-depth: 0
      - name: Reconcile README and roadmap
        run: python scripts/_temporary_reconcile_open_position_docs.py
      - name: Commit living documents and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_open_position_docs.yml .github/workflows/_temp_open_position_focus.yml scripts/_temporary_reconcile_open_position_docs.py
          git add README.md docs/roadmap.md
          git commit -m "Reconcile open-position account-state architecture"
          git push origin HEAD:feature/open-position-account-state
