**Evidence state: IMPLEMENTED / EMPIRICAL AGGREGATES NOT YET OPENED BY THIS PACKAGE.** The successor option-worthiness contract binds the accepted standalone and conditioning-v1 artifacts and derives descriptive underlying-move evidence without a raw-market reread. Its frozen move thresholds are 1%, 2%, 3%, and 5%. It reports all-comparable, walk-forward-test, and conditioning-selected populations separately, with route/direction return distributions, MFE/MAE distributions, favorable/adverse threshold frequencies, daily 1/5/20-session diagnostics, intraday holding-time diagnostics, selected-fold stability/concentration, and the exact observed 28-route / 21-economic-family implementation inventory.

