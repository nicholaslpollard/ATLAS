name: Temporary option-worthiness excursion-window clarification

on:
  push:
    branches:
      - research/successor-optionworthiness-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/successor-optionworthiness-v1
          fetch-depth: 0
      - name: Apply clarification
        shell: bash
        run: |
          set -euo pipefail
          python .github/_temporary_optionworthiness_window_patch_20260915.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clarify option-worthiness excursion windows"
          git push origin HEAD:research/successor-optionworthiness-v1
