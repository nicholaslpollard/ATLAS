name: Temporary selected daily path package finalization

on:
  push:
    branches:
      - research/successor-selected-daily-path-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/successor-selected-daily-path-v1
          fetch-depth: 0
      - name: Apply final package corrections and living-document handoff
        shell: bash
        run: |
          python scripts/_temporary_finalize_selected_daily_path_20260915.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize selected daily path diagnostic package"
          git push origin HEAD:research/successor-selected-daily-path-v1
