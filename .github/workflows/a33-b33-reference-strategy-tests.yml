name: ATLAS A33 B33 reference strategy foundation

on:
  push:
    branches:
      - 'phase-a33-b33-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-strategy-foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Validate A33 B33 frozen reference foundation
        run: python scripts/validate_a33_b33_reference_foundation.py
      - name: Run focused reference strategy tests
        run: python -m pytest -q tests/unit/test_a33_b33_foundations.py tests/unit/test_reference_strategy_policy.py tests/unit/test_reference_daily_features.py tests/unit/test_reference_strategy_runner.py tests/unit/test_strategy_trial_ledger.py tests/unit/test_phase16_status_api.py
