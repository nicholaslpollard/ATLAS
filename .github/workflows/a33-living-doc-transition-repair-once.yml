name: A33 living-doc transition repair once

on:
  push:
    branches:
      - a34-5-frontend-operator-dashboard
    paths:
      - '.github/workflows/a33-living-doc-transition-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout A34.5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a34-5-frontend-operator-dashboard
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Repair A33/B33 living-document transition validation
        run: python scripts/_repair_a33_living_doc_transition_once.py
      - name: Validate repaired foundation contract
        run: python scripts/validate_a33_b33_reference_foundation.py
      - name: Run focused A33/B33 regressions
        run: >-
          python -m pytest -q
          tests/unit/test_a33_b33_foundations.py
          tests/unit/test_reference_strategy_runner.py
          tests/unit/test_reference_lake_adapter.py
      - name: Validate repository hygiene
        shell: bash
        run: |
          python -m py_compile scripts/validate_a33_b33_reference_foundation.py
          git diff --check
          grep -q 'post-consumption protected-row accounting' scripts/validate_a33_b33_reference_foundation.py
          grep -q 'monotonic lifecycle' README.md
          grep -q 'compatibility validation distinguishes' docs/roadmap.md
          test ! -e scripts/_repair_a33_living_doc_transition_once.py
          test ! -e .github/workflows/a33-living-doc-transition-repair-once.yml
      - name: Commit repaired validator and living docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair A33 living-document transition validation'
          git push origin HEAD:a34-5-frontend-operator-dashboard
