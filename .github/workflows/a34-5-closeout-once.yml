name: A34.5 closeout once

on:
  push:
    branches:
      - a34-5-frontend-operator-dashboard
    paths:
      - '.github/workflows/a34-5-closeout-once.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout A34.5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a34-5-frontend-operator-dashboard

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Reconcile completed V2 evidence and A34.5 living docs
        run: python scripts/_closeout_v2_walkforward_a34_5_once.py

      - name: Run focused A34.5 acceptance tests
        run: >-
          python -m pytest -q
          tests/unit/test_a34_5_paper_dashboard.py
          tests/unit/test_atlas_console_contract.py
          tests/unit/test_phase19_preview_server.py

      - name: Validate closeout boundaries
        shell: bash
        run: |
          python -m py_compile packages/control_plane/paper_dashboard.py packages/control_plane/phase19_http_server.py packages/control_plane/phase19_preview_server.py
          node --check apps/web/atlas_console.js
          node --check apps/web/paper_dashboard.js
          git diff --check
          grep -q '93,380 master-protected return rows' README.md
          grep -q 'A34.5 grants no PAPER' docs/roadmap.md
          test ! -e scripts/_closeout_v2_walkforward_a34_5_once.py
          test ! -e .github/workflows/a34-5-closeout-once.yml

      - name: Commit living-document closeout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close V2 walk-forward evidence and A34.5 observability gate'
          git push origin HEAD:a34-5-frontend-operator-dashboard
