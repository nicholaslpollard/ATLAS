name: A34.5 stale truth reconcile once

on:
  push:
    branches:
      - a34-5-frontend-operator-dashboard
    paths:
      - '.github/workflows/a34-5-stale-truth-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout A34.5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a34-5-frontend-operator-dashboard

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Reconcile stale current-truth statements
        run: python scripts/_reconcile_a34_5_stale_truth_once.py

      - name: Validate living documents
        shell: bash
        run: |
          git diff --check
          grep -q 'consumed exactly once on 2026-09-07' README.md
          grep -q 'Empirical V2 DEVELOPMENT and' README.md
          grep -q 'PR #60 implements the A34.5' docs/roadmap.md
          ! grep -q 'No empirical replay exists in this' README.md
          ! grep -q 'Historical results, PAPER authority, and LIVE authority remain absent' README.md
          test ! -e scripts/_reconcile_a34_5_stale_truth_once.py
          test ! -e .github/workflows/a34-5-stale-truth-once.yml

      - name: Commit reconciled living documents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile A34.5 and V2 current truth'
          git push origin HEAD:a34-5-frontend-operator-dashboard
