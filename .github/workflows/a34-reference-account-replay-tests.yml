name: ATLAS A34 reference account replay

on:
  push:
    branches:
      - 'phase-a34-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-account-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Validate A34 frozen account replay
        run: python scripts/validate_a34_reference_account_replay.py
      - name: Validate A34 PIT regime context
        run: python scripts/validate_a34_reference_regime_context.py
      - name: Validate A34.5 browser JavaScript syntax
        shell: bash
        run: |
          node --check apps/web/observability.js
          node --check apps/web/observability_controls.js
          node --check apps/web/paper_dashboard.js
          node --check apps/web/atlas_console.js
          node --check apps/web/atlas_overview_style.js
          node --check apps/web/atlas_overview.js
          node --check apps/web/atlas_console_runtime.js
          node --check apps/web/phase19_preview.js
      - name: Run focused account replay and browser tests
        run: python -m pytest -q tests/unit/test_reference_lake_adapter.py tests/unit/test_reference_regime_context.py tests/unit/test_reference_strategy_runner.py tests/unit/test_reference_portfolio_replay.py tests/unit/test_reference_replay_read_model.py tests/unit/test_phase16_status_api.py tests/unit/test_phase19_observability_http.py tests/unit/test_a34_5_paper_dashboard.py tests/unit/test_phase19_preview_server.py tests/unit/test_atlas_console_contract.py
