name: ATLAS efficiency protocol docs patch

on:
  push:
    branches:
      - docs-validated-efficiency-protocol
    paths:
      - .github/workflows/atlas-efficiency-protocol-docs.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs-validated-efficiency-protocol
          fetch-depth: 0
      - name: Apply and commit protocol documentation
        shell: bash
        run: |
          python .github/atlas_efficiency_protocol_patch.py
          rm .github/atlas_efficiency_protocol_patch.py
          rm .github/workflows/atlas-efficiency-protocol-docs.yml
          git diff --check
          git config user.name "ATLAS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Document validated ATLAS efficiency protocol"
          git push origin HEAD:docs-validated-efficiency-protocol
