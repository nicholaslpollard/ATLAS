      - name: Validate pre-Phase33 FINRA short-interest source feasibility
        run: python scripts/validate_alpha_gate_finra_short_interest_feasibility.py

      - name: Validate pre-Phase33 FINRA short-interest PIT source audit
        run: python scripts/validate_alpha_gate_finra_short_interest_pit_audit.py

      - name: Validate pre-Phase33 FINRA short-interest frozen scientific policy
        run: python scripts/validate_alpha_gate_finra_short_interest_scientific_policy.py

      - name: Validate pre-Phase33 FINRA short-interest predictor/development implementation
