name: ATLAS tests

on:
  push:
    branches:
      - main
      - 'phase-*'
      - 'cumulative-*'
      - 'alpha-gate-*'
  pull_request:
    branches:
      - main
      - 'phase-*'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Validate dependency lock
        run: python scripts/validate_dependency_lock.py

      - name: Validate secret hygiene
        run: python scripts/validate_secret_hygiene.py

      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Validate local ATLAS doctor
        run: python scripts/atlas_doctor.py --json

      - name: Validate provider-free feature benchmark
        run: python scripts/benchmark_local_features.py --self-test --json

      - name: Compile
        run: python -m compileall -q packages apps scripts tests

      - name: Validate browser JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/observability.js
          node --check apps/web/observability_controls.js

      - name: Validate foundation
        run: python scripts/validate_foundation.py

      - name: Validate Phase 3
        run: python scripts/validate_phase3.py

      - name: Validate Phase 4
        run: python scripts/validate_phase4.py

      - name: Validate Phase 5
        run: python scripts/validate_phase5.py

      - name: Validate Phase 6
        run: python scripts/validate_phase6.py

      - name: Validate Phase 7
        run: python scripts/validate_phase7.py

      - name: Validate Phase 8
        run: python scripts/validate_phase8.py

      - name: Validate Phase 9
        run: python scripts/validate_phase9.py

      - name: Validate Phase 10
        run: python scripts/validate_phase10.py

      - name: Validate Phase 10 final acceptance
        run: python scripts/validate_phase10_final.py

      - name: Validate historical backfill Gate 1
        run: python scripts/validate_historical_backfill_gate1.py

      - name: Validate historical backfill Gate 2 status
        run: python scripts/validate_historical_backfill_gate2.py

      - name: Validate historical backfill Gate 3 status
        run: python scripts/validate_historical_backfill_gate3.py

      - name: Validate Phase 13 contracts
        run: python scripts/validate_phase13.py

      - name: Validate Phase 14 contracts
        run: python scripts/validate_phase14.py

      - name: Validate cumulative foundation audit contracts
        run: python scripts/validate_cumulative_foundation.py

      - name: Validate Phase 15 contracts
        run: python scripts/validate_phase15.py

      - name: Validate Phase 16 contracts
        run: python scripts/validate_phase16.py

      - name: Validate Phase 16 closeout contracts
        run: python scripts/validate_phase16_closeout.py

      - name: Validate Phase 17 contracts
        run: python scripts/validate_phase17.py

      - name: Validate Phase 18 contracts
        run: python scripts/validate_phase18.py

      - name: Validate Phase 19 stacked observability contracts
        run: python scripts/validate_phase19.py

      - name: Validate Phase 20 deterministic orchestration contracts
