name: B35 canonical-bar conversion optimization

on:
  push:
    branches:
      - b35-runtime-observability-parallel-replay

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b35-runtime-observability-parallel-replay
          fetch-depth: 0
      - name: Apply validated canonical-bar conversion optimization
        shell: bash
        run: |
          python .github/b35_canonical_bars_itertuples_patch.py
          rm .github/b35_canonical_bars_itertuples_patch.py
          rm .github/workflows/b35-canonical-bars-itertuples.yml
          rm -f .b35-canonical-bars-itertuples-trigger
          python -m py_compile packages/backtesting/b35_development_replay.py tests/unit/test_b35_canonical_bar_conversion.py
          git diff --check
          git config user.name "ATLAS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Optimize validated B35 canonical bar conversion"
          git push origin HEAD:b35-runtime-observability-parallel-replay
