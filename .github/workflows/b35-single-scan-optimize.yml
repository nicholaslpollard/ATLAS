name: B35 single-scan source optimization

on:
  push:
    branches:
      - b35-runtime-observability-parallel-replay

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b35-runtime-observability-parallel-replay
          fetch-depth: 0
      - name: Apply single-scan source optimization
        shell: bash
        run: |
          python scripts/_tmp_b35_single_scan_patch.py
          rm .github/workflows/b35-single-scan-optimize.yml
          rm scripts/_tmp_b35_single_scan_patch.py
          rm -f .github/workflows/.trigger-placeholder
          python -m py_compile packages/backtesting/b35_development_source.py
          git diff --check
          git config user.name "ATLAS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/roadmap.md packages/backtesting/b35_development_source.py tests/unit/test_b35_development_source.py .github/workflows/b35-single-scan-optimize.yml scripts/_tmp_b35_single_scan_patch.py .github/workflows/.trigger-placeholder
          git commit -m "Optimize B35 source scan without changing evidence"
          git push origin HEAD:b35-runtime-observability-parallel-replay
