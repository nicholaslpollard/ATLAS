name: ATLAS SEC beneficial-ownership alpha-gate contracts

on:
  push:
    branches:
      - 'alpha-gate-sec-beneficial-ownership-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  beneficial-ownership-alpha-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile beneficial-ownership research package
        run: python -m compileall -q packages/providers/sec_edgar_archive.py packages/backtesting/alpha_gate_beneficial_ownership_feasibility.py packages/backtesting/alpha_gate_beneficial_ownership_source_repair.py packages/backtesting/alpha_gate_beneficial_ownership_scientific_policy.py packages/backtesting/alpha_gate_beneficial_ownership_predictor.py packages/backtesting/alpha_gate_beneficial_ownership_development.py packages/backtesting/alpha_gate_beneficial_ownership_transport_repair.py packages/backtesting/alpha_gate_beneficial_ownership_closeout_probe.py scripts/run_alpha_gate_beneficial_ownership_feasibility.py scripts/run_alpha_gate_beneficial_ownership_source_repair.py scripts/run_alpha_gate_beneficial_ownership_development.py scripts/probe_alpha_gate_beneficial_ownership_closeout_evidence.py scripts/validate_alpha_gate_beneficial_ownership_feasibility.py scripts/validate_alpha_gate_beneficial_ownership_source_repair.py scripts/validate_alpha_gate_beneficial_ownership_scientific_contract.py scripts/validate_alpha_gate_beneficial_ownership_development.py scripts/validate_alpha_gate_beneficial_ownership_closeout_probe.py tests/unit/test_alpha_gate_beneficial_ownership_feasibility.py tests/unit/test_alpha_gate_beneficial_ownership_source_repair.py tests/unit/test_alpha_gate_beneficial_ownership_scientific_policy.py tests/unit/test_alpha_gate_beneficial_ownership_development.py tests/unit/test_alpha_gate_beneficial_ownership_closeout_probe.py
      - name: Retain accepted XBRL negative closeout
        run: python scripts/validate_alpha_gate_xbrl_closeout.py
      - name: Validate SEC beneficial-ownership source feasibility contracts
        run: python scripts/validate_alpha_gate_beneficial_ownership_feasibility.py
      - name: Validate SEC beneficial-ownership targeted source repair
        run: python scripts/validate_alpha_gate_beneficial_ownership_source_repair.py
      - name: Validate SEC beneficial-ownership frozen scientific contract
        run: python scripts/validate_alpha_gate_beneficial_ownership_scientific_contract.py
      - name: Validate SEC beneficial-ownership development implementation
        run: python scripts/validate_alpha_gate_beneficial_ownership_development.py
      - name: Validate beneficial-ownership closeout evidence probe contracts
        run: python scripts/validate_alpha_gate_beneficial_ownership_closeout_probe.py
      - name: Run beneficial-ownership focused unit tests
        run: python -m pytest -q tests/unit/test_alpha_gate_beneficial_ownership_feasibility.py tests/unit/test_alpha_gate_beneficial_ownership_source_repair.py tests/unit/test_alpha_gate_beneficial_ownership_scientific_policy.py tests/unit/test_alpha_gate_beneficial_ownership_development.py tests/unit/test_alpha_gate_beneficial_ownership_closeout_probe.py
