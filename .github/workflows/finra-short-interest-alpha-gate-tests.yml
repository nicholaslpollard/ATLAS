name: ATLAS FINRA short-interest alpha-gate contracts

on:
  push:
    branches:
      - 'alpha-gate-finra-short-interest-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  finra-short-interest-alpha-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile FINRA short-interest research package
        run: python -m compileall -q packages/providers/finra_short_interest.py packages/backtesting/alpha_gate_finra_short_interest_feasibility.py packages/backtesting/alpha_gate_finra_short_interest_pit_audit.py packages/backtesting/alpha_gate_finra_short_interest_scientific_policy.py packages/backtesting/alpha_gate_finra_short_interest_predictor.py packages/backtesting/alpha_gate_finra_short_interest_pit_evidence_binding_repair.py packages/backtesting/alpha_gate_finra_short_interest_development.py packages/backtesting/alpha_gate_finra_short_interest_source_closeout_probe.py scripts/run_alpha_gate_finra_short_interest_feasibility.py scripts/run_alpha_gate_finra_short_interest_pit_audit.py scripts/run_alpha_gate_finra_short_interest_development.py scripts/probe_alpha_gate_finra_short_interest_source_closeout.py scripts/validate_alpha_gate_finra_short_interest_feasibility.py scripts/validate_alpha_gate_finra_short_interest_pit_audit.py scripts/validate_alpha_gate_finra_short_interest_scientific_policy.py scripts/validate_alpha_gate_finra_short_interest_development.py scripts/validate_alpha_gate_finra_short_interest_source_closeout_probe.py tests/unit/test_finra_short_interest_provider.py tests/unit/test_alpha_gate_finra_short_interest_feasibility.py tests/unit/test_alpha_gate_finra_short_interest_pit_audit.py tests/unit/test_alpha_gate_finra_short_interest_scientific_policy.py tests/unit/test_alpha_gate_finra_short_interest_predictor.py tests/unit/test_alpha_gate_finra_short_interest_development.py tests/unit/test_alpha_gate_finra_short_interest_source_closeout_probe.py
      - name: Retain accepted beneficial-ownership negative closeout
        run: python scripts/validate_alpha_gate_beneficial_ownership_closeout.py
      - name: Validate FINRA consolidated short-interest source feasibility contract
        run: python scripts/validate_alpha_gate_finra_short_interest_feasibility.py
      - name: Validate FINRA consolidated short-interest PIT audit contract
        run: python scripts/validate_alpha_gate_finra_short_interest_pit_audit.py
      - name: Validate FINRA consolidated short-interest frozen scientific policy
        run: python scripts/validate_alpha_gate_finra_short_interest_scientific_policy.py
      - name: Validate FINRA consolidated short-interest predictor/development implementation
        run: python scripts/validate_alpha_gate_finra_short_interest_development.py
      - name: Validate FINRA consolidated short-interest source-only closeout probe
        run: python scripts/validate_alpha_gate_finra_short_interest_source_closeout_probe.py
      - name: Run FINRA short-interest focused unit tests
        run: python -m pytest -q tests/unit/test_finra_short_interest_provider.py tests/unit/test_alpha_gate_finra_short_interest_feasibility.py tests/unit/test_alpha_gate_finra_short_interest_pit_audit.py tests/unit/test_alpha_gate_finra_short_interest_scientific_policy.py tests/unit/test_alpha_gate_finra_short_interest_predictor.py tests/unit/test_alpha_gate_finra_short_interest_development.py tests/unit/test_alpha_gate_finra_short_interest_source_closeout_probe.py
