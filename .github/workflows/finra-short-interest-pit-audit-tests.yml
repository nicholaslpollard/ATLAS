name: ATLAS FINRA short-interest PIT audit contracts

on:
  push:
    branches:
      - 'alpha-gate-finra-short-interest-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  finra-short-interest-pit-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile FINRA PIT audit package
        run: python -m compileall -q packages/backtesting/alpha_gate_finra_short_interest_pit_audit.py scripts/run_alpha_gate_finra_short_interest_pit_audit.py scripts/validate_alpha_gate_finra_short_interest_pit_audit.py tests/unit/test_alpha_gate_finra_short_interest_pit_audit.py
      - name: Retain beneficial-ownership negative closeout
        run: python scripts/validate_alpha_gate_beneficial_ownership_closeout.py
      - name: Retain FINRA source feasibility contract
        run: python scripts/validate_alpha_gate_finra_short_interest_feasibility.py
      - name: Validate FINRA PIT audit contract
        run: python scripts/validate_alpha_gate_finra_short_interest_pit_audit.py
      - name: Run FINRA PIT focused unit tests
        run: python -m pytest -q tests/unit/test_finra_short_interest_provider.py tests/unit/test_alpha_gate_finra_short_interest_feasibility.py tests/unit/test_alpha_gate_finra_short_interest_pit_audit.py
