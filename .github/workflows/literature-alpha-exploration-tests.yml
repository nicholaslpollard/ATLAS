name: ATLAS literature alpha exploration

on:
  push:
    branches:
      - literature-anchored-alpha-exploration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Compile exploratory modules
        run: >-
          python -m py_compile
          packages/backtesting/literature_momseason_policy.py
          packages/backtesting/literature_momseason_source.py
          packages/backtesting/literature_momseason_feasibility.py
          packages/backtesting/literature_momseason_total_return_source.py
          packages/backtesting/literature_momseason_total_return_source_v2.py
          packages/backtesting/literature_momseason_total_return_source_v3.py
          packages/backtesting/literature_momseason_total_return_source_v4.py
          packages/backtesting/literature_momseason_adjusted_predictor_source.py
          packages/backtesting/literature_momseason_native_population.py
          packages/backtesting/literature_momseason_research_freeze.py
          packages/backtesting/literature_momseason_development.py
          packages/backtesting/literature_momseason_development_identity_repair.py
          packages/backtesting/literature_momseason_development_progress.py
          packages/backtesting/literature_momseason_development_sec_transport.py
          packages/backtesting/literature_momseason_development_target_transport.py
          packages/backtesting/literature_momseason_development_source_diagnostic.py
          packages/backtesting/literature_momseason_lit01_closeout.py
          packages/backtesting/literature_momseason_lit02_source_policy.py
          packages/backtesting/literature_momseason_lit02_source_feasibility.py
          scripts/run_literature_momseason_source_feasibility.py
          scripts/run_literature_momseason_total_return_source_audit.py
          scripts/run_literature_momseason_total_return_source_audit_v2.py
          scripts/run_literature_momseason_total_return_source_audit_v3.py
          scripts/run_literature_momseason_total_return_source_audit_v4.py
          scripts/run_literature_momseason_adjusted_predictor_source.py
          scripts/run_literature_momseason_native_population.py
          scripts/run_literature_momseason_research_freeze.py
          scripts/run_literature_momseason_development.py
          scripts/diagnose_literature_momseason_development_source.py
          scripts/close_literature_momseason_lit01.py
          scripts/run_literature_momseason_lit02_source_feasibility.py

      - name: Run focused exploratory tests
        run: >-
          python -m pytest
          tests/unit/test_literature_momseason.py
          tests/unit/test_literature_momseason_total_return_source.py
          tests/unit/test_literature_momseason_total_return_source_v2.py
          tests/unit/test_literature_momseason_total_return_source_v3.py
          tests/unit/test_literature_momseason_total_return_source_v4.py
          tests/unit/test_literature_momseason_adjusted_predictor_source.py
          tests/unit/test_literature_momseason_native_population.py
          tests/unit/test_literature_momseason_research_freeze.py
          tests/unit/test_literature_momseason_development.py
          tests/unit/test_literature_momseason_development_identity_repair.py
          tests/unit/test_literature_momseason_development_progress.py
          tests/unit/test_literature_momseason_development_sec_transport.py
          tests/unit/test_literature_momseason_development_target_transport.py
          tests/unit/test_literature_momseason_development_source_diagnostic.py
          tests/unit/test_literature_momseason_lit01_closeout.py
          tests/unit/test_literature_momseason_lit02_source_feasibility.py
          -q