name: ATLAS literature alpha exploration

on:
  push:
    branches:
      - literature-anchored-alpha-exploration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Compile exploratory modules
        run: >-
          python -m py_compile
          packages/backtesting/literature_momseason_policy.py
          packages/backtesting/literature_momseason_source.py
          packages/backtesting/literature_momseason_feasibility.py
          scripts/run_literature_momseason_source_feasibility.py

      - name: Run focused exploratory tests
        run: python -m pytest tests/unit/test_literature_momseason.py -q
