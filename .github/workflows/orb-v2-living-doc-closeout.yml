name: ORB v2 living document closeout

on:
  push:
    branches:
      - research/orb-stocks-in-play-literature-v2-development-runner
    paths:
      - .github/workflows/orb-v2-living-doc-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/orb-stocks-in-play-literature-v2-development-runner
          fetch-depth: 0
      - name: Update living documents
        run: python scripts/_temporary_orb_v2_living_doc_update.py
      - name: Commit living document update
        run: |
          rm scripts/_temporary_orb_v2_living_doc_update.py
          rm .github/workflows/orb-v2-living-doc-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md scripts/_temporary_orb_v2_living_doc_update.py .github/workflows/orb-v2-living-doc-closeout.yml
          git commit -m "Record ORB v2 DEVELOPMENT runner pre-outcome gate"
          git push origin HEAD:research/orb-stocks-in-play-literature-v2-development-runner
