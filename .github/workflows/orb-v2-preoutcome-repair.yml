name: ORB v2 pre-outcome repair

on:
  push:
    branches:
      - research/orb-stocks-in-play-literature-v2-development-runner
    paths:
      - .github/workflows/orb-v2-preoutcome-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/orb-stocks-in-play-literature-v2-development-runner
          fetch-depth: 0
      - name: Patch runner and tests before outcomes open
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('packages/backtesting/successor_orb_stocks_in_play_literature_v2_development.py')
          text = runner.read_text(encoding='utf-8')

          replacements = [
              (
                  '    source["raw_share_volume"] = source["volume"].astype("float64") / factor\n',
                  '    # V2 deliberately preserves provider-native split-adjusted volume as supplied.\n'
                  '    # The accepted source contract explicitly treats inverse-price-factor volume\n'
                  '    # equivalence as audit-only, so do not manufacture a raw-volume estimate.\n'
                  '    source["provider_native_share_volume"] = source["volume"].astype("float64")\n',
              ),
              (
                  '            frame["raw_share_volume"].rolling(window=14, min_periods=14).mean().shift(1)\n',
                  '            frame["provider_native_share_volume"]\n'
                  '            .rolling(window=14, min_periods=14)\n'
                  '            .mean()\n'
                  '            .shift(1)\n',
              ),
              (
                  '        pieces: list[pd.DataFrame] = []\n        try:\n            for unit in units:\n',
                  '        pieces: list[pd.DataFrame] = []\n'
                  '        session_ordinals = {\n'
                  '            session: ordinal\n'
                  '            for ordinal, session in enumerate(\n'
                  '                source.calendar.sessions_in_range(DEVELOPMENT_START, DEVELOPMENT_END)\n'
                  '            )\n'
                  '        }\n'
                  '        try:\n'
                  '            for unit in units:\n',
              ),
              (
                  '                if not query.empty:\n                    pieces.append(query)\n',
                  '                if not query.empty:\n'
                  '                    query["session_ordinal"] = query["session_date"].map(session_ordinals)\n'
                  '                    if query["session_ordinal"].isna().any():\n'
                  '                        raise OrbLiteratureV2DevelopmentError(\n'
                  '                            "opening snapshot session is outside frozen XNYS DEVELOPMENT"\n'
                  '                        )\n'
                  '                    query["session_ordinal"] = query["session_ordinal"].astype("int64")\n'
                  '                    pieces.append(query)\n',
              ),
              (
                  '                "session_date",\n                "opening_price",\n',
                  '                "session_date",\n                "session_ordinal",\n                "opening_price",\n',
              ),
              (
                  '                       avg(opening_five_minute_volume) OVER (\n                           PARTITION BY ticker ORDER BY session_date\n                           ROWS BETWEEN 14 PRECEDING AND 1 PRECEDING\n                       ) AS prior_average_opening_volume_14\n',
                  '                       avg(opening_five_minute_volume) OVER (\n'
                  '                           PARTITION BY ticker ORDER BY session_date\n'
                  '                           ROWS BETWEEN 14 PRECEDING AND 1 PRECEDING\n'
                  '                       ) AS prior_average_opening_volume_14,\n'
                  '                       lag(session_ordinal, 14) OVER (\n'
                  '                           PARTITION BY ticker ORDER BY session_date\n'
                  '                       ) AS prior_14th_session_ordinal\n',
              ),
              (
                  '                WHERE prior_opening_count_14 = 14\n                  AND isfinite(opening_price) AND opening_price > 5.0\n',
                  '                WHERE prior_opening_count_14 = 14\n'
                  '                  AND session_ordinal - prior_14th_session_ordinal = 14\n'
                  '                  AND isfinite(opening_price) AND opening_price > 5.0\n',
              ),
              (
                  '                           avg(opening_five_minute_volume) OVER (\n                               PARTITION BY ticker ORDER BY session_date ROWS BETWEEN 14 PRECEDING AND 1 PRECEDING\n                           ) AS prior_avg\n',
                  '                           avg(opening_five_minute_volume) OVER (\n'
                  '                               PARTITION BY ticker ORDER BY session_date ROWS BETWEEN 14 PRECEDING AND 1 PRECEDING\n'
                  '                           ) AS prior_avg,\n'
                  '                           lag(session_ordinal, 14) OVER (\n'
                  '                               PARTITION BY ticker ORDER BY session_date\n'
                  '                           ) AS prior_14th_session_ordinal\n',
              ),
              (
                  '                WHERE prior_count=14 AND opening_price>5.0\n',
                  '                WHERE prior_count=14\n'
                  '                  AND session_ordinal - prior_14th_session_ordinal = 14\n'
                  '                  AND opening_price>5.0\n',
              ),
              (
                  '        "opening_range_low": float(candidate["opening_range_low"]),\n    }\n',
                  '        "opening_range_low": float(candidate["opening_range_low"]),\n'
                  '        "entry_stop_price": None,\n'
                  '        "entry_price": None,\n'
                  '        "entry_timestamp_utc": None,\n'
                  '        "entry_fill_reason": None,\n'
                  '        "stop_loss_price": None,\n'
                  '        "exit_price": None,\n'
                  '        "exit_timestamp_utc": None,\n'
                  '        "exit_reason": None,\n'
                  '        "holding_minutes": None,\n'
                  '        "gross_return": None,\n'
                  '        "net_return_0": None,\n'
                  '        "net_return_10": None,\n'
                  '        "net_return_25": None,\n'
                  '        "net_return_50": None,\n'
                  '        "net_return_100": None,\n'
                  '        "primary_net_return": None,\n'
                  '        "stress_net_return": None,\n'
                  '        "path_mfe": None,\n'
                  '        "path_adverse": None,\n'
                  '        "entry_bar_extremes_excluded": True,\n'
                  '        "exit_bar_extremes_excluded": True,\n'
                  '        "terminal_exit_return_included": True,\n'
                  '    }\n',
              ),
              (
                  '    candidates = duckdb.connect(":memory:").execute(\n        f"SELECT * FROM read_parquet(\'{_sql_path(selected_candidates)}\') WHERE direction IN (\'LONG\',\'SHORT\')"\n    ).fetchdf()\n',
                  '    candidate_conn = duckdb.connect(":memory:")\n'
                  '    try:\n'
                  '        candidates = candidate_conn.execute(\n'
                  '            f"SELECT * FROM read_parquet(\'{_sql_path(selected_candidates)}\') "\n'
                  '            "WHERE direction IN (\'LONG\',\'SHORT\')"\n'
                  '        ).fetchdf()\n'
                  '    finally:\n'
                  '        candidate_conn.close()\n',
              ),
              (
                  '        if threshold_artifacts:\n            threshold_sql = f"read_parquet({_sql_paths(threshold_artifacts)}, hive_partitioning=false, union_by_name=true)"\n            threshold_result = conn.execute(\n',
                  '        if threshold_artifacts:\n'
                  '            threshold_sql = f"read_parquet({_sql_paths(threshold_artifacts)}, hive_partitioning=false, union_by_name=true)"\n'
                  '            threshold_row_count = int(conn.execute(f"SELECT count(*) FROM {threshold_sql}").fetchone()[0])\n'
                  '            if threshold_row_count:\n'
                  '                threshold_result = conn.execute(\n',
              ),
              (
                  '            threshold_columns = [item[0] for item in threshold_result.description]\n            thresholds = [\n                dict(zip(threshold_columns, row, strict=True)) for row in threshold_result.fetchall()\n            ]\n',
                  '                threshold_columns = [item[0] for item in threshold_result.description]\n'
                  '                thresholds = [\n'
                  '                    dict(zip(threshold_columns, row, strict=True))\n'
                  '                    for row in threshold_result.fetchall()\n'
                  '                ]\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'runner patch anchor missing: {old[:120]!r}')
              text = text.replace(old, new, 1)
          runner.write_text(text, encoding='utf-8')

          tests = Path('tests/test_successor_orb_stocks_in_play_literature_v2_development.py')
          text = tests.read_text(encoding='utf-8')
          old_fp = '2a62b54a5413a1ce62e19ae1489df36095350ba53e4dad2d4784fb3b083fe542'
          new_fp = '87ee4ff703f8040d88c22147444aa992d196ab49be91dc749e3035e3c15e739b'
          if old_fp not in text:
              raise SystemExit('test fingerprint anchor missing')
          text = text.replace(old_fp, new_fp)
          anchor = '''    assert changed.iloc[14]["prior_atr_14_dollars"] == pytest.approx(\n        baseline.iloc[14]["prior_atr_14_dollars"]\n    )\n\n\n'''
          addition = '''    assert changed.iloc[14]["prior_atr_14_dollars"] == pytest.approx(\n        baseline.iloc[14]["prior_atr_14_dollars"]\n    )\n\n\ndef test_daily_volume_uses_provider_native_value_without_inverse_price_transform() -> None:\n    bars = _daily_rows()\n    bars["unadjusted_close"] = bars["close"] * 2.0\n    result = build_prior_daily_features(bars)\n    expected_volume = np.mean([1_500_000.0 + index * 10_000.0 for index in range(14)])\n    assert result.iloc[14]["prior_average_daily_share_volume_14"] == pytest.approx(expected_volume)\n\n\n'''
          if anchor not in text:
              raise SystemExit('daily feature test anchor missing')
          text = text.replace(anchor, addition, 1)
          old = '''                    "session_date": session,\n                    "opening_price": 10.0,\n'''
          new = '''                    "session_date": session,\n                    "session_ordinal": session_index,\n                    "opening_price": 10.0,\n'''
          if old not in text:
              raise SystemExit('rank fixture anchor missing')
          text = text.replace(old, new, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Remove helper workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/orb-v2-preoutcome-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/backtesting/successor_orb_stocks_in_play_literature_v2_development.py tests/test_successor_orb_stocks_in_play_literature_v2_development.py .github/workflows/orb-v2-preoutcome-repair.yml
          git commit -m "Repair ORB v2 pre-outcome source semantics"
          git push origin HEAD:research/orb-stocks-in-play-literature-v2-development-runner
