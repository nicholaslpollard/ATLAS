name: ATLAS Phase 32 contracts

on:
  push:
    branches:
      - 'phase-32-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase32-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Validate Phase 32 SEC 8-K feasibility contracts
        run: python scripts/validate_phase32.py
      - name: Validate Phase 32 semantic source contracts
        run: python scripts/validate_phase32_semantic.py
      - name: Validate Phase 32 corrected semantic V2 contracts
        run: python scripts/validate_phase32_semantic_v2.py
      - name: Validate Phase 32 semantic V2 source census contracts
        run: python scripts/validate_phase32_semantic_source_census.py
      - name: Validate Phase 32 frozen scientific policy
        run: python scripts/validate_phase32_policy.py
      - name: Run Phase 32 focused unit tests
        run: python -m pytest -q tests/unit/test_phase32_feasibility.py tests/unit/test_phase32_semantic_feasibility.py tests/unit/test_phase32_semantic_feasibility_v2.py tests/unit/test_phase32_semantic_source_census.py tests/unit/test_phase32_policy.py
