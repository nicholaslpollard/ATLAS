name: PR82 one-time corrective sync

on:
  push:
    branches:
      - review/successor-strategy-implementation

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Install PR82 maintenance helper'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review/successor-strategy-implementation
          fetch-depth: 0
      - name: Apply corrective sync
        run: python scripts/_pr82_sync.py
      - name: Commit corrected implementation and living documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix successor implementation and sync living docs"
          git push origin HEAD:review/successor-strategy-implementation
