name: PR82 pre-outcome semantic repair

on:
  push:
    branches:
      - review/successor-strategy-implementation
    paths:
      - scripts/_pr82_preoutcome_semantic_repair.py
      - .github/workflows/pr82_preoutcome_semantic_repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: review/successor-strategy-implementation
          fetch-depth: 0

      - name: Apply deterministic pre-outcome semantic repair
        run: python scripts/_pr82_preoutcome_semantic_repair.py

      - name: Remove one-time repair machinery
        run: |
          rm scripts/_pr82_preoutcome_semantic_repair.py
          rm .github/workflows/pr82_preoutcome_semantic_repair.yml

      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/features/successor_practitioner.py packages/strategies/successor_intraday_rules.py tests/unit/test_successor_strategy_implementation.py scripts/_pr82_preoutcome_semantic_repair.py .github/workflows/pr82_preoutcome_semantic_repair.yml
          git diff --cached --check
          git commit -m "Repair successor point-in-time quality clocks"
          git push origin HEAD:review/successor-strategy-implementation
