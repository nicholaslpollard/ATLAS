name: PR84 living-document reconciliation

on:
  push:
    branches:
      - codex/successor-development-outcome-runner

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[pr84-docs-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Reconcile living documents
        run: python scripts/_pr84_docs_reconcile.py
      - name: Validate documentation diff
        shell: bash
        run: |
          git diff --check
          git diff -- README.md docs/roadmap.md docs/strategy_evidence_register.md
      - name: Commit reconciliation
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/roadmap.md docs/strategy_evidence_register.md; then
            echo "No living-document changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md
          git commit -m "Reconcile successor outcome runner living docs [pr84-docs-reconciled]"
          git push origin HEAD:codex/successor-development-outcome-runner
