name: PR84 asserted runner repair

on:
  push:
    branches:
      - codex/successor-development-outcome-runner

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply asserted repair
        run: python scripts/_pr84_patch_runner.py
      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- packages/backtesting/successor_development_runner.py packages/backtesting/successor_development_engine.py
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- packages/backtesting/successor_development_runner.py packages/backtesting/successor_development_engine.py; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/backtesting/successor_development_runner.py packages/backtesting/successor_development_engine.py
          git commit -m "Repair successor runner portability and retained context"
          git push origin HEAD:codex/successor-development-outcome-runner
