name: PR84 scientific repair

on:
  push:
    branches:
      - codex/successor-development-outcome-runner

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[pr84-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Apply asserted repair
        run: python scripts/_pr84_scientific_repair.py
      - name: Validate syntax and diff
        shell: bash
        run: |
          python -m py_compile packages/backtesting/successor_development_engine.py packages/backtesting/successor_development_runner.py
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- packages/backtesting/successor_development_engine.py packages/backtesting/successor_development_runner.py; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/backtesting/successor_development_engine.py packages/backtesting/successor_development_runner.py
          git commit -m "Repair successor scientific input semantics [pr84-repaired]"
          git push origin HEAD:codex/successor-development-outcome-runner
