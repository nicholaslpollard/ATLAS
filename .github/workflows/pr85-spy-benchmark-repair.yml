name: PR85 successor SPY benchmark repair

on:
  push:
    branches:
      - codex/repair-successor-spy-benchmark

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply asserted repair
        run: python scripts/_repair_pr85_spy_benchmark.py
      - name: Verify focused syntax
        run: python -m py_compile packages/backtesting/successor_development_runner.py tests/test_successor_development_runner.py
      - name: Commit permanent repair and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair bounded same-session SPY benchmark close"
          git push origin HEAD:codex/repair-successor-spy-benchmark
