name: PR86 fix roadmap source wording

on:
  push:
    branches:
      - codex/successor-spy-daily-source-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix roadmap SPY source wording'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/successor-spy-daily-source-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply asserted roadmap correction
        run: python scripts/_pr86_fix_roadmap_source_wording.py
      - name: Commit permanent package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Fix roadmap SPY source wording"
          git push origin HEAD:codex/successor-spy-daily-source-audit
