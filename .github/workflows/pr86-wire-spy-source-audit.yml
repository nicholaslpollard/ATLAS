name: PR86 wire successor SPY source audit

on:
  push:
    branches:
      - codex/successor-spy-daily-source-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Wire successor SPY source audit into runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/successor-spy-daily-source-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply asserted wiring patch
        run: python scripts/_pr86_wire_spy_source_audit.py
      - name: Syntax check touched Python
        run: |
          python -m py_compile packages/backtesting/successor_spy_benchmark_source.py
          python -m py_compile packages/backtesting/successor_development_runner.py
          python -m py_compile scripts/run_successor_spy_source_audit.py
          python -m py_compile tests/test_successor_spy_benchmark_source.py
          python -m py_compile tests/test_successor_development_runner.py
      - name: Commit permanent package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Wire successor SPY source audit into runner"
          git push origin HEAD:codex/successor-spy-daily-source-audit
