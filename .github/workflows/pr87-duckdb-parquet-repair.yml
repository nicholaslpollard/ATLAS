name: PR87 DuckDB Parquet repair

on:
  push:
    branches:
      - codex/repair-spy-audit-duckdb-parquet

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repair-spy-audit-duckdb-parquet
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply asserted DuckDB Parquet repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/backtesting/successor_spy_benchmark_source.py')
          text = path.read_text(encoding='utf-8')

          old = "from packages.data.alpaca_v2_rebuild import V2Layout\n"
          new = (
              "from packages.data.alpaca_v2_rebuild import V2Layout\n"
              "from packages.data.duckdb_connection import connect_utc\n"
              "from packages.data.sql import sql_string\n"
          )
          assert old in text and new not in text
          text = text.replace(old, new, 1)

          old = '''def _write_parquet_atomic(path: Path, frame: pd.DataFrame) -> str:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temp = unique_temp_path(path)\n    try:\n        frame.to_parquet(temp, index=False)\n        replace_with_retry(temp, path)\n    finally:\n        temp.unlink(missing_ok=True)\n    return _sha256_file(path)\n'''
          new = '''def _duckdb_projection(columns: tuple[str, ...] | None) -> str:\n    if columns is None:\n        return "*"\n    return ", ".join('"' + column.replace('"', '""') + '"' for column in columns)\n\n\ndef _read_parquet_frame(\n    path: Path,\n    *,\n    columns: tuple[str, ...] | None = None,\n) -> pd.DataFrame:\n    con = connect_utc(":memory:")\n    try:\n        return con.execute(\n            f"SELECT {_duckdb_projection(columns)} "\n            f"FROM read_parquet({sql_string(path)}, hive_partitioning=false)"\n        ).fetchdf()\n    finally:\n        con.close()\n\n\ndef _write_parquet_atomic(path: Path, frame: pd.DataFrame) -> str:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temp = unique_temp_path(path)\n    con = connect_utc(":memory:")\n    try:\n        con.register("spy_benchmark_frame", frame)\n        con.execute(\n            f"COPY (SELECT * FROM spy_benchmark_frame) TO {sql_string(temp)} "\n            "(FORMAT PARQUET, COMPRESSION ZSTD)"\n        )\n        replace_with_retry(temp, path)\n    finally:\n        con.close()\n        temp.unlink(missing_ok=True)\n    return _sha256_file(path)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        frame = pd.read_parquet(\n            canonical_path,\n            columns=[\n                "symbol",\n                "session_date",\n                "close",\n                "provider",\n                "dataset",\n                "timeframe",\n                "session_segment",\n                "is_adjusted",\n                "source_id",\n            ],\n        )\n'''
          new = '''        frame = _read_parquet_frame(\n            canonical_path,\n            columns=(\n                "symbol",\n                "session_date",\n                "close",\n                "provider",\n                "dataset",\n                "timeframe",\n                "session_segment",\n                "is_adjusted",\n                "source_id",\n            ),\n        )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '    frame = pd.read_parquet(benchmark_path)\n'
          new = '    frame = _read_parquet_frame(benchmark_path)\n'
          assert old in text
          text = text.replace(old, new, 1)

          assert 'pd.read_parquet(' not in text
          assert '.to_parquet(' not in text
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_successor_spy_benchmark_source.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'def test_contract_forbids_2026_split_daily_partition() -> None:',
              'def test_contract_forbids_2026_native_daily_partition() -> None:',
          )
          addition = '''\n\ndef test_parquet_io_uses_duckdb_without_pandas_optional_engines(tmp_path, monkeypatch) -> None:\n    def blocked(*args, **kwargs):\n        raise AssertionError("pandas optional Parquet engine must not be used")\n\n    monkeypatch.setattr(pd, "read_parquet", blocked)\n    monkeypatch.setattr(pd.DataFrame, "to_parquet", blocked)\n    path = tmp_path / "spy.parquet"\n    frame = pd.DataFrame(\n        [{"session_date": date(2019, 8, 12), "close": 287.44}]\n    )\n\n    sha256 = source._write_parquet_atomic(path, frame)\n    loaded = source._read_parquet_frame(\n        path, columns=("session_date", "close")\n    )\n\n    assert len(sha256) == 64\n    assert pd.to_datetime(loaded["session_date"], errors="raise").dt.date.tolist() == [\n        date(2019, 8, 12)\n    ]\n    assert loaded["close"].tolist() == [287.44]\n'''
          assert 'test_parquet_io_uses_duckdb_without_pandas_optional_engines' not in tests
          tests += addition
          test_path.write_text(tests, encoding='utf-8')
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run focused regression
        run: python -m pytest -q tests/test_successor_spy_benchmark_source.py tests/test_successor_development_runner.py
      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          git rm .github/workflows/pr87-duckdb-parquet-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/backtesting/successor_spy_benchmark_source.py tests/test_successor_spy_benchmark_source.py
          git commit -m "Use DuckDB for successor SPY Parquet IO"
          git push origin HEAD:codex/repair-spy-audit-duckdb-parquet
