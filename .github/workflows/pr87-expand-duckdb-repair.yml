name: PR87 expand DuckDB Parquet repair

on:
  push:
    branches:
      - codex/repair-spy-audit-duckdb-parquet

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repair-spy-audit-duckdb-parquet
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply expanded repair
        run: python scripts/_pr87_expand_duckdb_repair.py
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile touched Python
        run: python -m py_compile packages/backtesting/successor_spy_benchmark_source.py packages/backtesting/successor_development_runner.py tests/test_successor_spy_benchmark_source.py tests/test_successor_development_runner.py
      - name: Run successor focused regression
        run: >-
          python -m pytest -q
          tests/test_successor_spy_benchmark_source.py
          tests/test_successor_development_runner.py
          tests/test_successor_development_cli.py
          tests/test_successor_development_outcomes.py
          tests/test_successor_development_engine.py
      - name: Remove one-shot machinery and commit permanent repair
        shell: bash
        run: |
          rm scripts/_pr87_expand_duckdb_repair.py
          rm .github/workflows/pr87-expand-duckdb-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden successor Parquet IO on DuckDB'
          git push origin HEAD:codex/repair-spy-audit-duckdb-parquet
