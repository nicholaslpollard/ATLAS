name: Record accepted successor SPY audit

on:
  push:
    branches:
      - codex/record-successor-spy-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/record-successor-spy-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply living-document update
        run: python scripts/_record_successor_spy_audit.py
      - name: Verify accepted evidence appears in all living documents
        shell: bash
        run: |
          grep -F 'c575d5df1b7f0d0a7734efc3833329f57f73c953b7b67ccb4ea54d33abb4555c' README.md
          grep -F 'c575d5df1b7f0d0a7734efc3833329f57f73c953b7b67ccb4ea54d33abb4555c' docs/roadmap.md
          grep -F 'c575d5df1b7f0d0a7734efc3833329f57f73c953b7b67ccb4ea54d33abb4555c' docs/strategy_evidence_register.md
          grep -F '29d7ea9d6a322b4b55af872f7d2e5097777738b209727a487cfd0dcf1306790d' README.md
          grep -F '2,596' docs/roadmap.md
          grep -F 'optional' docs/strategy_evidence_register.md
      - name: Remove one-shot machinery and commit permanent evidence
        shell: bash
        run: |
          rm scripts/_record_successor_spy_audit.py
          rm .github/workflows/record-successor-spy-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record accepted successor SPY source audit'
          git push origin HEAD:codex/record-successor-spy-audit
