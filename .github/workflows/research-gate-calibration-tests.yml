name: ATLAS research gate calibration

on:
  push:
    branches:
      - 'research-gate-calibration-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  research-gate-calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run research gate calibration validator
        run: python scripts/validate_research_gate_calibration.py
      - name: Run focused research-gate audit unit tests
        run: python -m pytest -q tests/unit/test_research_gate_calibration.py tests/unit/test_research_population_coverage.py tests/unit/test_research_gate_freeze.py
