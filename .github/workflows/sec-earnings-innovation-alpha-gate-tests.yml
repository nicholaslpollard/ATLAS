name: ATLAS SEC earnings-innovation alpha-gate contracts

on:
  push:
    branches:
      - 'alpha-gate-sec-earnings-innovation-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sec-earnings-innovation-alpha-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile SEC earnings-innovation gate packages
        run: python -m compileall -q packages/providers/sec_xbrl.py packages/providers/sec_edgar.py packages/backtesting/alpha_gate_sec_earnings_innovation_feasibility.py packages/backtesting/alpha_gate_sec_earnings_innovation_pit_audit.py packages/backtesting/alpha_gate_sec_earnings_innovation_pit_diagnostics.py packages/backtesting/alpha_gate_sec_earnings_innovation_pit_diagnostics_v2.py scripts/run_alpha_gate_sec_earnings_innovation_feasibility.py scripts/run_alpha_gate_sec_earnings_innovation_pit_audit.py scripts/diagnose_alpha_gate_sec_earnings_innovation_pit_audit.py scripts/diagnose_alpha_gate_sec_earnings_innovation_pit_audit_v2.py scripts/validate_alpha_gate_sec_earnings_innovation_feasibility.py scripts/validate_alpha_gate_sec_earnings_innovation_pit_audit.py tests/unit/test_alpha_gate_sec_earnings_innovation_feasibility.py tests/unit/test_alpha_gate_sec_earnings_innovation_pit_audit.py tests/unit/test_alpha_gate_sec_earnings_innovation_pit_diagnostics.py tests/unit/test_alpha_gate_sec_earnings_innovation_pit_diagnostics_v2.py
      - name: Retain FINRA accepted-negative closeout boundary
        run: python scripts/validate_alpha_gate_finra_short_interest_closeout.py
      - name: Validate SEC earnings-innovation source feasibility contracts
        run: python scripts/validate_alpha_gate_sec_earnings_innovation_feasibility.py
      - name: Validate SEC earnings-innovation PIT source-audit contracts
        run: python scripts/validate_alpha_gate_sec_earnings_innovation_pit_audit.py
      - name: Run SEC earnings-innovation focused unit tests
        run: python -m pytest -q tests/unit/test_alpha_gate_sec_earnings_innovation_feasibility.py tests/unit/test_alpha_gate_sec_earnings_innovation_pit_audit.py tests/unit/test_alpha_gate_sec_earnings_innovation_pit_diagnostics.py tests/unit/test_alpha_gate_sec_earnings_innovation_pit_diagnostics_v2.py
