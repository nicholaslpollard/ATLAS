name: Temporary move-time forecast docs

on:
  push:
    branches:
      - feature/move-time-forecast-foundation
    paths:
      - .github/workflows/temporary_move_time_forecast_docs.yml

permissions:
  contents: write

jobs:
  reconcile-living-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/move-time-forecast-foundation
          fetch-depth: 0
      - name: Reconcile living documents
        run: python scripts/temporary_move_time_forecast_docs.py
      - name: Commit living documents
        run: |
          if git diff --quiet -- README.md docs/roadmap.md; then
            echo "Living documents already reconciled."
            exit 0
          fi
          git config user.name "atlas-docs-bot"
          git config user.email "atlas-docs-bot@users.noreply.github.com"
          git add README.md docs/roadmap.md
          git commit -m "Record move-time forecast foundation"
          git push origin HEAD:feature/move-time-forecast-foundation
