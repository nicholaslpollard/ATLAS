name: Temporary simulation decision record docs

on:
  push:
    branches:
      - feature/simulation-decision-record-foundation
    paths:
      - .github/workflows/temporary_simulation_decision_record_docs.yml

permissions:
  contents: write

jobs:
  reconcile-living-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/simulation-decision-record-foundation
          fetch-depth: 0
      - name: Reconcile living documents
        run: python scripts/temporary_simulation_decision_record_docs.py
      - name: Commit living-document reconciliation
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/roadmap.md; then
            echo "Living documents already reconciled."
            exit 0
          fi
          git config user.name "atlas-docs-bot"
          git config user.email "atlas-docs-bot@users.noreply.github.com"
          git add README.md docs/roadmap.md
          git commit -m "Record deterministic simulation decision record"
          git push origin HEAD:feature/simulation-decision-record-foundation
