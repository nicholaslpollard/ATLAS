name: Temporary final B35 roadmap fix
on:
  push:
    branches: [b35-targeted-minute-perturbations]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-targeted-minute-perturbations
          fetch-depth: 0
      - run: python scripts/tmp_fix_b35_roadmap.py
      - name: Commit final roadmap reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize B35 targeted perturbation roadmap handoff"
          git push origin HEAD:b35-targeted-minute-perturbations
