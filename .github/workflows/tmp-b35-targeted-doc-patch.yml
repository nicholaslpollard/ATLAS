name: Temporary B35 targeted living-doc patch
on:
  push:
    branches: [b35-targeted-minute-perturbations]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-targeted-minute-perturbations
          fetch-depth: 0
      - run: python scripts/tmp_patch_b35_targeted_docs.py
      - name: Commit living-document reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile living docs for B35 targeted perturbations"
          git push origin HEAD:b35-targeted-minute-perturbations
