name: Temporary B35 targeted optimization
on:
  push:
    branches: [b35-targeted-minute-perturbations]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-targeted-minute-perturbations
          fetch-depth: 0
      - run: python scripts/tmp_optimize_b35_targeted.py
      - name: Commit optimized targeted replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/backtesting/b35_targeted_perturbations.py tests/unit/test_b35_targeted_perturbations.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize B35 targeted replay with exact canonical baseline reuse"
          git push origin HEAD:b35-targeted-minute-perturbations
