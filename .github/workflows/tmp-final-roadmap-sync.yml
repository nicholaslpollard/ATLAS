name: Temporary final roadmap synchronization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/tmp_final_roadmap_sync.py'
      - '.github/workflows/tmp-final-roadmap-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile roadmap current state
        run: python scripts/tmp_final_roadmap_sync.py
      - name: Commit roadmap sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md
          if git diff --cached --quiet; then
            echo "No roadmap changes to commit"
          else
            git commit -m "Synchronize roadmap with current Track B plan"
            git push origin HEAD:main
          fi
