name: Temporary reconcile successor 21-family plan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-reconcile-successor-21.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile living documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def req(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          t = req(t,
              '**eight genuinely new mechanisms** for a planned **18-family practitioner library**.',
              '**eleven genuinely new mechanisms** for a planned **21-family practitioner library**.',
              'README family count')
          t = req(t, '### Eight new successor families', '### Eleven new successor families', 'README successor heading')
          anchor = '''18. **Triangle breakout — `pract_triangle_breakout_v1`.** Fit deterministic converging
              support/resistance boundaries from repeated prior pivots, classify ascending,
              descending or symmetrical geometry, and fire only on an information-safe
              boundary breakout. Breakout direction controls the signal; the visual pattern
              name alone never does.
          '''
          insert = anchor + '''19. **ADX/DMI continuation/filter — `pract_adx_dmi_continuation_v1`.** Use DMI for objective directional state and ADX for trend-strength state under one frozen rule. ADX alone never chooses direction. Test whether established directional strength improves continuation expectancy rather than assuming all high-ADX conditions are favorable.\n20. **Relative-strength momentum — `pract_relative_strength_momentum_v1`.** Measure PIT ticker out/underperformance versus SPY over a small frozen horizon set and test continuation as its own family. The same relative-strength features may also be shared context for other strategies; sector-relative strength waits for an accepted PIT sector map.\n21. **Session-level failed-break/reclaim — `pract_session_failed_break_reclaim_v1`.** Test breach and bounded reclaim of objective previous-day high/low and premarket high/low levels with normalized breach depth, explicit reclaim confirmation, sweep-extreme invalidation and one coherent exit hierarchy. This is observable failed-break/reversal research, not a claim about hidden institutional liquidity.\n'''
          if '21. **Session-level failed-break/reclaim' not in t:
              t = req(t, anchor, insert, 'README triangle insertion')
          t = t.replace('the **eight-new-family successor contract**', 'the **eleven-new-family successor contract**')
          t = t.replace('## Successor Strategy Lab direction — 19 families', '## Successor Strategy Lab direction — 21 families')
          t = t.replace('targets **19 economic strategy families** plus', 'targets **21 economic strategy families** plus')
          t = t.replace('nine distinct additions are planned: Bollinger mean reversion, ATR/range expansion, ADX/DMI continuation/filter, support/resistance rejection, relative-strength momentum versus market/sector, deterministic head-and-shoulders/inverse, double-top/bottom, flag/pennant/triangle continuation, and objective session-level failed-break/reclaim.', 'eleven distinct additions are planned: Bollinger mean reversion, ATR/range expansion, VWAP reclaim/reject, pivot support/resistance breakout, ADX/DMI continuation/filter, relative-strength momentum versus market/sector, deterministic head-and-shoulders/inverse, double-top/bottom, flag/pennant continuation, triangle breakout, and objective session-level failed-break/reclaim.')
          p.write_text(t, encoding='utf-8')

          p = Path('docs/roadmap.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('### B36 — Successor 19-family Strategy Laboratory', '### B36 — Successor 21-family Strategy Laboratory')
          t = t.replace('**Core roster:** retain the ten accepted economic families as immutable baselines and add nine materially distinct mechanisms: Bollinger mean reversion; ATR/range expansion; ADX/DMI continuation/filter; support/resistance rejection; relative-strength momentum versus market/sector where data authority exists; objective head-and-shoulders/inverse; double-top/bottom; flag/pennant/triangle continuation; and objective session-level failed-break/reclaim.', '**Core roster:** retain the ten accepted economic families as immutable baselines and add eleven materially distinct mechanisms: Bollinger mean reversion; ATR/range expansion; VWAP reclaim/reject; pivot support/resistance breakout; ADX/DMI continuation/filter; relative-strength momentum versus market/sector where data authority exists; objective head-and-shoulders/inverse; double-top/bottom; flag/pennant continuation; triangle breakout; and objective session-level failed-break/reclaim.')
          t = t.replace('targets **19 economic strategy families**', 'targets **21 economic strategy families**')
          t = t.replace('the ten retained families plus nine distinct additions', 'the ten retained families plus eleven distinct additions')
          p.write_text(t, encoding='utf-8')

          p = Path('docs/strategy_evidence_register.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('targets **19 economic strategy families**: the ten retained families plus nine distinct additions.', 'targets **21 economic strategy families**: the ten retained families plus eleven distinct additions.')
          t = t.replace('## 7. Successor research hypotheses accepted for testing', '## 7. Successor research hypotheses accepted for testing')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit living-document correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md
          git commit -m "Reconcile 21-family successor strategy plan"
          git push origin HEAD:main
