name: Temporary strategy evidence living-doc patch
on:
  push:
    branches: [b35-strategy-evidence-register]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b35-strategy-evidence-register
          fetch-depth: 0
      - run: python scripts/tmp_patch_living_docs.py
      - name: Commit living-doc reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile living docs with strategy evidence register"
          git push origin HEAD:b35-strategy-evidence-register
