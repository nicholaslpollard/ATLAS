name: Temporary successor research living-doc sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/tmp_sync_successor_research_docs_v2.py'
      - '.github/workflows/tmp-sync-successor-research-docs.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply living-document reconciliation
        run: python scripts/tmp_sync_successor_research_docs_v2.py
      - name: Commit reconciled living documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/strategy_evidence_register.md
          if git diff --cached --quiet; then
            echo "No living-document changes to commit"
          else
            git commit -m "Reconcile successor strategy research direction"
            git push origin HEAD:main
          fi
