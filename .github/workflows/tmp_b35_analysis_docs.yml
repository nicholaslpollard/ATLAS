name: Temporary B35 analysis living-doc patch

on:
  push:
    branches:
      - b35-condition-selector-analysis

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply B35 analysis doc patch
        run: python scripts/_tmp_patch_b35_analysis_docs.py
      - name: Remove temporary patch machinery
        run: |
          rm scripts/_tmp_patch_b35_analysis_docs.py
          rm .github/workflows/tmp_b35_analysis_docs.yml
      - name: Commit documentation update
        run: |
          git config user.name "ATLAS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/roadmap.md scripts/_tmp_patch_b35_analysis_docs.py .github/workflows/tmp_b35_analysis_docs.yml
          git commit -m "Document B35 evidence analyzer handoff"
          git push
