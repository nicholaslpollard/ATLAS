name: Temporary B35 closeout docs patch

on:
  push:
    branches:
      - docs-b35-canonical-closeout

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply closeout patch
        run: python scripts/_tmp_patch_b35_closeout_docs.py
      - name: Remove temporary patch machinery
        run: |
          rm scripts/_tmp_patch_b35_closeout_docs.py
          rm .github/workflows/tmp_b35_closeout_docs.yml
      - name: Commit documentation closeout
        run: |
          git config user.name "ATLAS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/roadmap.md scripts/_tmp_patch_b35_closeout_docs.py .github/workflows/tmp_b35_closeout_docs.yml
          git commit -m "Record B35 canonical replay closeout"
          git push
