name: V2 handoff truth finalize once

on:
  push:
    branches:
      - a34-5-frontend-operator-dashboard
    paths:
      - '.github/workflows/v2-handoff-truth-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a34-5-frontend-operator-dashboard
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Finalize handoff truth
        run: python scripts/_finalize_v2_handoff_truth_once.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q 'master holdout was subsequently consumed exactly once' README.md
          grep -q 'next V2 data task is the finite B34' README.md
          ! grep -q 'protected holdout remains unconsumed as of this repository handoff' README.md
          test ! -e scripts/_finalize_v2_handoff_truth_once.py
          test ! -e .github/workflows/v2-handoff-truth-once.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize V2 and A34.5 handoff truth'
          git push origin HEAD:a34-5-frontend-operator-dashboard
