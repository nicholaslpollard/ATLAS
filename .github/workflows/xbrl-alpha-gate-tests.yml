name: ATLAS XBRL alpha-gate contracts

on:
  push:
    branches:
      - 'alpha-gate-sec-xbrl-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  xbrl-alpha-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install ATLAS from locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile XBRL alpha-gate package
        run: python -m compileall -q packages/providers/sec_xbrl.py packages/providers/sec_xbrl_pit.py packages/providers/massive/xbrl_pit.py packages/backtesting/alpha_gate_xbrl_feasibility.py packages/backtesting/alpha_gate_xbrl_pit_audit.py packages/backtesting/alpha_gate_xbrl_pit_identity_repair.py packages/backtesting/alpha_gate_xbrl_scientific_policy.py scripts/run_alpha_gate_xbrl_feasibility.py scripts/run_alpha_gate_xbrl_pit_audit.py scripts/run_alpha_gate_xbrl_pit_identity_repair.py scripts/run_alpha_gate_xbrl_scientific_contract.py scripts/validate_alpha_gate_xbrl_feasibility.py scripts/validate_alpha_gate_xbrl_pit_audit.py scripts/validate_alpha_gate_xbrl_pit_identity_repair.py scripts/validate_alpha_gate_xbrl_scientific_contract.py tests/unit/test_alpha_gate_xbrl_feasibility.py tests/unit/test_alpha_gate_xbrl_pit_audit.py tests/unit/test_alpha_gate_xbrl_pit_boundaries.py tests/unit/test_alpha_gate_xbrl_pit_identity_repair.py tests/unit/test_alpha_gate_xbrl_scientific_policy.py
      - name: Retain Phase 32 negative closeout boundary
        run: python scripts/validate_phase32_closeout.py
      - name: Validate XBRL source-only feasibility contracts
        run: python scripts/validate_alpha_gate_xbrl_feasibility.py
      - name: Validate XBRL PIT source/chronology/identity contracts
        run: python scripts/validate_alpha_gate_xbrl_pit_audit.py
      - name: Validate targeted XBRL PIT identity repair
        run: python scripts/validate_alpha_gate_xbrl_pit_identity_repair.py
      - name: Validate frozen XBRL scientific contract
        run: python scripts/validate_alpha_gate_xbrl_scientific_contract.py
      - name: Run XBRL scientific preflight
        run: python scripts/run_alpha_gate_xbrl_scientific_contract.py
      - name: Run XBRL focused unit tests
        run: python -m pytest -q tests/unit/test_alpha_gate_xbrl_feasibility.py tests/unit/test_alpha_gate_xbrl_pit_audit.py tests/unit/test_alpha_gate_xbrl_pit_boundaries.py tests/unit/test_alpha_gate_xbrl_pit_identity_repair.py tests/unit/test_alpha_gate_xbrl_scientific_policy.py
