massive:
  provider:
    name: massive
    rest_base_url: https://api.massive.com
    websocket_delayed_url: wss://delayed.massive.com/stocks
    websocket_realtime_url: wss://socket.massive.com/stocks
    flat_file_endpoint: https://files.massive.com
    flat_file_bucket: flatfiles

  credentials:
    api_key_env: MASSIVE_API_KEY
    s3_access_key_env: MASSIVE_S3_ACCESS_KEY_ID
    s3_secret_key_env: MASSIVE_S3_SECRET_ACCESS_KEY

  stocks:
    websocket_minute_channel: AM
    websocket_default_subscription: "*"
    use_delayed_feed_initially: true
