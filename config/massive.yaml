massive:
  provider:
    name: massive
    rest_base_url: https://api.massive.com
    websocket_delayed_url: wss://delayed.massive.com/stocks
    websocket_realtime_url: wss://socket.massive.com/stocks
    flat_file_endpoint: https://files.massive.com
    flat_file_bucket: flatfiles

  credentials:
    api_key_env: MASSIVE_API_KEY
    s3_access_key_env: MASSIVE_S3_ACCESS_KEY_ID
    s3_secret_key_env: MASSIVE_S3_SECRET_ACCESS_KEY

  stocks:
    websocket_minute_channel: AM
    websocket_quote_channel: Q
    websocket_default_subscription: "*"
    use_delayed_feed_initially: true
    delayed_feed_expected_delay_seconds: 900
    realtime_feed_expected_delay_seconds: 0
    websocket_open_timeout_seconds: 10.0
    websocket_auth_timeout_seconds: 10.0
    websocket_ping_interval_seconds: 20.0
    websocket_ping_timeout_seconds: 20.0
    websocket_ingress_queue_size: 10000
    live_state_snapshot_interval_seconds: 5.0
    freshness_fresh_seconds: 90
    freshness_aging_seconds: 300

  flat_files:
    datasets:
      stock_minute_aggregates:
        prefix: us_stocks_sip/minute_aggs_v1
        local_subdir: massive/flat_files/minute_aggs
        expected_columns:
          - ticker
          - volume
          - open
          - close
          - high
          - low
          - window_start
          - transactions
      stock_daily_aggregates:
        prefix: us_stocks_sip/day_aggs_v1
        local_subdir: massive/flat_files/day_aggs
        expected_columns:
          - ticker
          - volume
          - open
          - close
          - high
          - low
          - window_start
          - transactions

    chunk_size_bytes: 4194304
    max_attempts: 4
    initial_retry_seconds: 1.0
    max_retry_seconds: 20.0
    validate_gzip_crc: true
    count_rows_during_validation: false

  reference:
    page_limit: 1000
    request_timeout_seconds: 30.0
    max_attempts: 4
    initial_retry_seconds: 1.0
    max_retry_seconds: 20.0
